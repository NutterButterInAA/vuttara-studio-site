<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#080a10" />

    <title>Page not found | Vuttara Studio</title>

    <style>
      :root {
        color-scheme: dark;

        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        color: #f7f8fc;
        background: #080a10;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;

        margin: 0;

        text-align: center;
      }

      main {
        width: min(560px, calc(100% - 32px));
      }

      h1 {
        margin: 0;

        font-size: clamp(4rem, 18vw, 9rem);
        letter-spacing: -0.08em;
      }

      p {
        color: #a3abc0;
        line-height: 1.7;
      }

      a {
        display: inline-flex;

        margin-top: 18px;
        padding: 12px 18px;

        border-radius: 10px;

        background: #8e5cff;
        color: #ffffff;

        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>404</h1>

      <p>
        The requested Vuttara Studio page could not be found.
      </p>

      <a href="/">Return home</a>
    </main>
  </body>
</html>
